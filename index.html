<!doctype html>
<html lang="pt-PT">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0f766e"><title>Diário Alimentar</title>
<style>
:root{--g:#0f766e;--g2:#115e59;--bg:#f2f6f5;--text:#182520;--muted:#64748b;--line:#d5e2dd;--red:#b42318}*{box-sizing:border-box;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}body{margin:0;background:var(--bg);color:var(--text)}header{position:sticky;top:0;z-index:5;padding:18px 16px;background:linear-gradient(135deg,var(--g2),var(--g));color:#fff;text-align:center;box-shadow:0 2px 10px #0002}h1{font-size:23px;margin:0}.wrap{max-width:720px;margin:auto;padding:16px}.card{background:#fff;border:1px solid var(--line);border-radius:15px;padding:16px;margin-bottom:16px;box-shadow:0 2px 9px #123b3010}h2{font-size:18px;margin:0 0 14px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.stat{border-radius:12px;color:#fff;padding:13px;text-align:center;background:#0f766e}.stat:nth-child(1){background:#dc2626}.stat:nth-child(2){background:#15803d}.stat:nth-child(3){background:#d97706}.stat:nth-child(4){background:#7e22ce}.stat b{display:block;font-size:24px}.stat span{font-size:12px}label{display:block;font-weight:700;font-size:14px;margin:14px 0 7px}input,textarea{width:100%;padding:12px;border:1px solid var(--line);border-radius:10px;font-size:16px;background:#fff}textarea{resize:vertical}button{width:100%;margin-top:12px;padding:14px;border:0;border-radius:10px;background:var(--g);color:white;font-size:16px;font-weight:750;cursor:pointer}button:disabled{opacity:.6}.secondary{background:#475569}.danger{background:var(--red)}.hidden{display:none!important}.note{font-size:13px;line-height:1.45;color:var(--muted)}.preview{margin-top:12px;text-align:center}.preview img{max-width:100%;max-height:300px;border:1px solid var(--line);border-radius:12px}.message{margin-top:12px;padding:12px;border-radius:10px;background:#ecfdf5;color:#065f46;font-size:14px;white-space:pre-wrap}.message.error{background:#fef2f2;color:#991b1b}.choice{display:flex;align-items:center;gap:9px;border:1px solid var(--line);padding:10px;border-radius:9px;margin-top:8px;font-size:14px}.choice input{width:auto}.meal{display:flex;gap:12px;border-bottom:1px solid #e7eeeb;padding:12px 0}.meal:last-child{border:0}.meal img{width:72px;height:72px;border-radius:10px;object-fit:cover}.meal h3{font-size:15px;margin:0 0 4px}.meal p{font-size:13px;color:var(--muted);margin:0 0 5px}.badges span{display:inline-block;background:#edf5f2;padding:4px 6px;border-radius:6px;margin:2px;font-size:12px;font-weight:700}.nutrition{background:#f0fdf4;border:1px solid #86efac;border-radius:10px;padding:12px;margin-top:12px}.nutrition b{color:#166534}
</style></head>
<body><header><h1>🍽️ Diário Alimentar</h1></header><main class="wrap">
<section class="card"><h2>LogMeal API</h2><p class="note">Cola apenas o <b>APIUser Token</b>. Não coloques “Bearer” antes do token.</p><input id="token" type="password" placeholder="APIUser Token"><button onclick="saveToken()">Guardar token</button><button class="secondary" onclick="removeToken()">Remover token</button><p class="note">O token fica apenas neste browser. Não o publiques no GitHub.</p></section>
<section class="card"><div class="grid"><div class="stat"><b id="kcal">0</b><span>kcal hoje</span></div><div class="stat"><b id="pro">0 g</b><span>proteína</span></div><div class="stat"><b id="carb">0 g</b><span>hidratos</span></div><div class="stat"><b id="fat">0 g</b><span>gordura</span></div></div></section>
<section class="card"><h2>Nova refeição</h2><label for="name">Nome da refeição</label><input id="name" placeholder="Ex.: Almoço"><label for="photo">Foto da refeição</label><input id="photo" type="file" accept="image/*" capture="environment"><div id="preview" class="preview hidden"><img id="previewImg" alt="Foto"></div><button id="analyse" onclick="analysePhoto()">🔍 Analisar foto</button><div id="message" class="message hidden"></div><div id="choices" class="hidden"></div><button id="confirm" class="hidden" onclick="confirmDishes()">Confirmar alimentos e obter valores</button><div id="nutrition" class="nutrition hidden"></div><label for="foods">Alimentos</label><textarea id="foods" rows="2" placeholder="Será preenchido após a análise; podes corrigir."></textarea><label for="calories">Calorias (kcal)</label><input id="calories" type="number" min="0" step="1"><label for="protein">Proteína (g)</label><input id="protein" type="number" min="0" step="0.1"><label for="carbs">Hidratos (g)</label><input id="carbs" type="number" min="0" step="0.1"><label for="fats">Gordura (g)</label><input id="fats" type="number" min="0" step="0.1"><button onclick="saveMeal()">💾 Guardar refeição</button></section>
<section class="card"><h2>Histórico</h2><div id="history"></div><button class="danger" onclick="clearMeals()">Apagar todos os registos</button></section></main>
<script>
const $=id=>document.getElementById(id);let token=localStorage.getItem('logmeal_token')||'',compressed=null,display=null,imageId=null,meals=JSON.parse(localStorage.getItem('diario_alimentar_meals')||'[]');$('token').value=token;
function msg(t,e=false){$('message').textContent=t;$('message').className='message '+(e?'error':'')}
function saveToken(){token=$('token').value.trim().replace(/^Bearer\s+/i,'');localStorage.setItem('logmeal_token',token);msg('Token guardado neste dispositivo.')};function removeToken(){token='';$('token').value='';localStorage.removeItem('logmeal_token');msg('Token removido.')}
function dataUrl(file){return new Promise((ok,no)=>{let r=new FileReader();r.onload=()=>ok(r.result);r.onerror=no;r.readAsDataURL(file)})}
function compress(file,max,q){return new Promise((ok,no)=>{let r=new FileReader();r.onload=()=>{let i=new Image();i.onload=()=>{let s=Math.min(1,max/Math.max(i.naturalWidth,i.naturalHeight)),c=document.createElement('canvas');c.width=Math.round(i.naturalWidth*s);c.height=Math.round(i.naturalHeight*s);c.getContext('2d').drawImage(i,0,0,c.width,c.height);c.toBlob(b=>b?ok(new File([b],'meal.jpg',{type:'image/jpeg'})):no(new Error('Erro na compressão')),'image/jpeg',q)};i.src=r.result};r.readAsDataURL(file)})}
async function prepare(file){let x=await compress(file,1600,.8);if(x.size>=950000)x=await compress(file,1280,.65);if(x.size>=950000)x=await compress(file,1024,.5);if(x.size>=1048576)throw Error('A foto continua maior que 1 MB. Tira outra foto ou escolhe uma imagem mais pequena.');return x}
$('photo').onchange=async()=>{let f=$('photo').files[0];if(!f)return;try{display=await dataUrl(f);compressed=await prepare(f);$('previewImg').src=display;$('preview').classList.remove('hidden');msg('Foto preparada: '+Math.round(compressed.size/1024)+' KB.')}catch(e){msg(e.message,true)}};
async function api(path,opt={}){let r=await fetch('https://api.logmeal.com/v2'+path,{...opt,headers:{Authorization:'Bearer '+token,...(opt.headers||{})}}),t=await r.text(),d;try{d=JSON.parse(t)}catch{d={message:t}}if(!r.ok)throw Error('API '+r.status+': '+(d.message||d.detail||d.error||t));return d}
function busy(x){$('analyse').disabled=x;$('analyse').textContent=x?'A analisar…':'🔍 Analisar foto'}
async function analysePhoto(){if(!token)return msg('Configura primeiro o APIUser Token.',true);if(!compressed)return msg('Escolhe uma foto e aguarda a preparação.',true);busy(true);try{let f=new FormData();f.append('image',compressed,'meal.jpg');let d=await api('/image/segmentation/complete',{method:'POST',body:f});imageId=d.imageId||d.image_id||d.id;let a=d.segmentation_results||d.segmentationResults||d.dishes||d.results||[];if(!imageId)throw Error('A resposta não trouxe imageId.');showChoices(a);msg('Análise concluída. Confirma o alimento identificado.')}catch(e){msg(e.message,true)}finally{busy(false)}}
function opts(s){return s.recognition_results||s.recognitionResults||s.dishes||s.candidates||s.predictions||[]}function nm(x){return x.name||x.dish_name||x.dishName||x.label||'Alimento'}function did(x){return x.id||x.dish_id||x.dishId||x.name}
function showChoices(arr){let root=$('choices');root.innerHTML='';if(!arr.length){root.innerHTML='<p class="note">Não foram identificados alimentos.</p>';return root.classList.remove('hidden')}arr.forEach((s,i)=>{let b=document.createElement('div');b.dataset.region=s.region_id||s.regionId||s.id||i;b.innerHTML='<label>Alimento '+(i+1)+'</label>';opts(s).slice(0,5).forEach((x,j)=>{let l=document.createElement('label');l.className='choice';l.innerHTML='<input type="radio" name="r'+i+'" value="'+String(did(x)).replace(/"/g,'&quot;')+'" '+(!j?'checked':'')+'><span>'+nm(x)+'</span>';b.appendChild(l)});root.appendChild(b)});root.classList.remove('hidden');$('confirm').classList.remove('hidden')}
function extract(d){let out={cal:0,p:0,c:0,f:0,names:[]};function walk(x){if(!x||typeof x!=='object')return;if(Array.isArray(x)){x.forEach(walk);return}for(let k in x){let v=x[k],n=String(k).toLowerCase();if(typeof v==='number'){if(/energy|calorie|kcal/.test(n))out.cal+=v;else if(/protein/.test(n))out.p+=v;else if(/carbo|^carbs$/.test(n))out.c+=v;else if(/^fat$|lipid/.test(n))out.f+=v}else if(typeof v==='string'&&/name|food|dish/.test(n)&&v.length<80&&!out.names.includes(v))out.names.push(v);walk(v)}}walk(d);return out}
async function confirmDishes(){let selected=[...$('choices').children].map(b=>{let r=b.querySelector('input:checked');return r?{region_id:b.dataset.region,dish_id:r.value}:null}).filter(Boolean);if(!selected.length)return msg('Escolhe pelo menos um alimento.',true);$('confirm').disabled=true;$('confirm').textContent='A obter valores…';try{await api('/image/confirm/dish',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({imageId:imageId,dishes:selected})});let d=await api('/nutrition/recipe/nutritionalInfo',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({imageId:imageId})});let v=extract(d);$('calories').value=Math.round(v.cal);$('protein').value=v.p.toFixed(1);$('carbs').value=v.c.toFixed(1);$('fats').value=v.f.toFixed(1);$('foods').value=v.names.join(', ')||[...$('choices').querySelectorAll('input:checked')].map(x=>x.parentElement.textContent.trim()).join(', ');$('nutrition').innerHTML='<b>Valores obtidos pela LogMeal</b><br>Calorias: '+Math.round(v.cal)+' kcal<br>Proteína: '+v.p.toFixed(1)+' g<br>Hidratos: '+v.c.toFixed(1)+' g<br>Gordura: '+v.f.toFixed(1)+' g';$('nutrition').classList.remove('hidden');msg(v.cal?'Valores preenchidos. Confirma-os e guarda a refeição.':'A LogMeal respondeu, mas não devolveu nutrientes para este alimento. Preenche os valores manualmente.')}catch(e){msg(e.message,true)}finally{$('confirm').disabled=false;$('confirm').textContent='Confirmar alimentos e obter valores'}}
function num(id){return Number($(id).value)||0}function saveMeal(){let m={id:Date.now(),date:new Date().toISOString(),name:$('name').value.trim()||'Refeição',photo:display,foods:$('foods').value.trim(),calories:num('calories'),protein:num('protein'),carbs:num('carbs'),fat:num('fats')};meals.push(m);localStorage.setItem('diario_alimentar_meals',JSON.stringify(meals));['name','foods','calories','protein','carbs','fats'].forEach(x=>$(x).value='');$('photo').value='';$('preview').classList.add('hidden');$('choices').classList.add('hidden');$('choices').innerHTML='';$('confirm').classList.add('hidden');$('nutrition').classList.add('hidden');compressed=null;display=null;imageId=null;msg('Refeição guardada.');render()}
function render(){let t=new Date().toDateString(),d=meals.filter(x=>new Date(x.date).toDateString()==t),s=k=>d.reduce((a,x)=>a+(+x[k]||0),0);$('kcal').textContent=Math.round(s('calories'));$('pro').textContent=s('protein').toFixed(0)+' g';$('carb').textContent=s('carbs').toFixed(0)+' g';$('fat').textContent=s('fat').toFixed(0)+' g';$('history').innerHTML=meals.length?[...meals].reverse().map(x=>'<div class="meal">'+(x.photo?'<img src="'+x.photo+'" alt="Foto">':'')+'<div><h3>'+x.name+'</h3><p>'+new Date(x.date).toLocaleString('pt-PT')+(x.foods?' · '+x.foods:'')+'</p><div class="badges"><span>'+x.calories+' kcal</span><span>'+x.protein+' g P</span><span>'+x.carbs+' g H</span><span>'+x.fat+' g G</span></div></div></div>').join(''):'<p class="note">Ainda não há refeições registadas.</p>'}function clearMeals(){if(confirm('Apagar todos os registos?')){meals=[];localStorage.removeItem('diario_alimentar_meals');render()}}render();
</script></body></html>
